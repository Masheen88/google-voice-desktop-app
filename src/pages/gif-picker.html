<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The picker is a trusted local page. GIPHY is the only external data/image source. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://*.giphy.com https://giphy.com; connect-src https://api.giphy.com; script-src 'self'; style-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GIF Picker - Voice Desktop</title>
    <link rel="stylesheet" href="gif-picker.css" />
  </head>
  <body>
    <main class="picker" aria-label="Voice Desktop GIF picker">
      <header class="header">
        <div class="header-left">
          <span class="logo">GIF</span>
          <span class="title">GIFs</span>
        </div>
        <button type="button" class="icon-button close" id="close" aria-label="Close GIF picker" title="Close">✕</button>
      </header>
      <div class="search-wrap">
        <label class="sr-only" for="search">Search animated GIFs</label>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.5-4.5"/></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search GIFs…" maxlength="50" />
        <kbd>/</kbd>
      </div>
      <nav class="tabs" aria-label="Browse GIFs">
        <button type="button" data-tab="trending" class="active">Trending</button>
        <button type="button" data-tab="favorites">★ Favorites</button>
        <button type="button" data-tab="recent">Recent</button>
      </nav>
      <section class="quick" id="quick" aria-label="Quick searches">
        <button data-query="laughing">😂 Laugh</button>
        <button data-query="yes">👍 Yes</button>
        <button data-query="nope">🙅 Nope</button>
        <button data-query="thank you">💜 Thanks</button>
      </section>
      <div class="results-wrap" id="results-wrap">
        <div id="status" role="status" aria-live="polite" class="status">Loading GIFs…</div>
        <button id="save-gif" class="more" type="button" hidden>Save selected GIF to attach manually</button>
        <div class="grid" id="grid" aria-label="GIF results"></div>
        <button id="more" class="more" type="button" hidden>Load more</button>
      </div>
      <footer>
        <span id="hint">Click a GIF to attach it · never auto-sends</span>
        <button type="button" class="credit" id="giphy" title="GIPHY provider details">Powered by <b>GIPHY</b></button>
      </footer>
    </main>
    <script src="gif-picker.js" defer></script>
  </body>
</html>
